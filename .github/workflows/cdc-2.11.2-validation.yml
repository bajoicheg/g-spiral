name: CDC 2.11.2 adoption validation

on:
  push:
    branches:
      - 'validation/cdc-2.11.2-adoption'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact vendored package tree
        run: |
          test "$(git rev-parse HEAD:.agents/skills/continuous-development-cycle)" = "7a7a7faa75b7fc9160d912d8fb507c6b9573d17f"
      - name: Install CDC validator dependencies
        run: python -m pip install -r .agents/skills/continuous-development-cycle/scripts/requirements.txt
      - name: Validate CDC package
        run: python -B .agents/skills/continuous-development-cycle/scripts/validate_package.py
      - name: Run CDC package tests
        run: python -B -m unittest discover -s .agents/skills/continuous-development-cycle/tests -v
      - name: Validate adapter and checkpoint
        run: |
          python -B .agents/skills/continuous-development-cycle/scripts/validate_adapter.py docs/development-cycle.yaml
          python -B .agents/skills/continuous-development-cycle/scripts/validate_checkpoint_24.py docs/work-status/current.md --adapter docs/development-cycle.yaml
      - name: Verify consumer lock
        run: |
          python - <<'PY'
          import json
          d=json.load(open("docs/cdc-consumer-lock.json", encoding="utf-8"))
          assert d["version"]=="2.11.2"
          assert d["release_ref"]=="refs/heads/release/v2.11.2"
          assert d["release_commit"]=="48e637b230e7640d0dcd13da60d712f38f59a2b6"
          assert d["package_tree"]=="7a7a7faa75b7fc9160d912d8fb507c6b9573d17f"
          print("CONSUMER_LOCK_GREEN")
          PY
