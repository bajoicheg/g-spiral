name: ci

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: g-spiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore GSpiral.sln
      - name: Test
        run: dotnet test GSpiral.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Publish portable single-file EXE
        run: dotnet publish src/GSpiral/GSpiral.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/publish/G-Spiral.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish/G-Spiral.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/G-Spiral.exe

  tag-v1-3-1:
    if: github.ref == 'refs/heads/feature/v1.3.1' && github.event.head_commit.message == 'release-v1.3.1'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag v1.3.1 from verified source snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.3.1 4f0682d5ca22919f2a2fc2375ef8af85dd2e6b5d
          git push origin refs/tags/v1.3.1
