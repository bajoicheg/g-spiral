name: ci

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: g-spiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore GSpiral.sln
      - name: Test
        run: dotnet test GSpiral.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Publish portable single-file EXE
        run: dotnet publish src/GSpiral/GSpiral.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/publish/G-Spiral.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish/G-Spiral.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/G-Spiral.exe

  publish-v1-3-1:
    if: github.ref == 'refs/heads/feature/v1.3.1' && github.event.head_commit.message == 'publish-v1.3.1'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release v1.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          target_commitish: release/v1.3.1-source
          name: G-Spiral 1.3.1
          body: |
            G-Spiral 1.3.1 — hotfix отображения диаграммы в XLSX.

            - исправлен белый прямоугольник вместо круговой диаграммы в Microsoft Excel;
            - native Open XML Pie3DChart заменён в итоговом XLSX на встроенный PNG, отрисованный тем же 3D-движком, что используется в приложении;
            - диаграмма содержит канонические цвета типов, перспективные боковые грани, легенду и доли типов в сумме набранных баллов;
            - структура таблиц, расчёты, округление и три листа XLSX сохранены без изменений;
            - regression-тест проверяет отсутствие ChartPart, наличие PNG ImagePart/xdr:pic, PNG-сигнатуру и Open XML-валидность книги.

            Сборка проверена Windows CI: automated tests, self-contained single-file publish и smoke-test G-Spiral.exe.
          files: artifacts/publish/G-Spiral.exe
