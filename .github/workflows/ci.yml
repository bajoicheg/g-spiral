name: ci

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: g-spiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore GSpiral.sln
      - name: Test
        run: dotnet test GSpiral.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Publish portable single-file EXE
        run: dotnet publish src/GSpiral/GSpiral.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/publish/G-Spiral.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish/G-Spiral.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/G-Spiral.exe

  release-v1-2-0:
    if: github.ref == 'refs/heads/feature/v1.2.0' && github.event.head_commit.message == 'chore: publish v1.2.0'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag v1.2.0 from release snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.2.0 bcc6f869719bbc76424b92e85eb3b334e7a15371
          git push origin refs/tags/v1.2.0
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: release/v1.2.0-source
          name: G-Spiral 1.2.0
          body: |
            G-Spiral 1.2.0 — portable Windows x64 release.

            Основные изменения:
            - новая атомарная методика: 42 скрытых ячейки, по 3–6 утверждений в каждой;
            - опрос по 7 этапам-столбцам с рандомизированным порядком утверждений;
            - принадлежность утверждений к типам скрыта во время прохождения;
            - каждая ячейка имеет 100 баллов, равномерно разделённых между её утверждениями;
            - результаты сортируются по убыванию и показывают баллы из 700 и абсолютный процент;
            - 3D-круговая диаграмма вместо бублика;
            - финальный экран показывает выбранные ответы по всем этапам;
            - XLSX теперь содержит три листа: «Выборы», «Таблица ответов», «Итоги»;
            - добавлено окно «О программе» с отсылкой к Spiral Dynamics и © 2026 V. Vasilev;
            - сохранены portable/offline-модель, автоподстановка имени/домена и открытие сохранённого файла/папки.

            Проверка релиза: 28/28 automated tests, Open XML validation, self-contained single-file publish и smoke-test G-Spiral.exe.

            Результаты версии 1.2.0 не следует напрямую сравнивать с 1.1.0 без учёта изменения методики.
          files: artifacts/publish/G-Spiral.exe
