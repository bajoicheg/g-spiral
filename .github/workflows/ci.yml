name: ci

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: g-spiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore GSpiral.sln
      - name: Test
        run: dotnet test GSpiral.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Publish portable single-file EXE
        run: dotnet publish src/GSpiral/GSpiral.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/publish/G-Spiral.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish/G-Spiral.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/publish/G-Spiral.exe

  release-v1-1-0:
    if: github.ref == 'refs/heads/feature/build-g-spiral-v1' && github.event.head_commit.message == 'chore: release v1.1.0'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: 00521ac010d66e7fb1f6e1deea726b88541fd860
          name: G-Spiral 1.1.0
          body: |
            Portable Windows x64 release of G-Spiral 1.1.0.

            Основные изменения:
            - автоматическое заполнение имени пользователя и компании из Windows с возможностью редактирования;
            - имя файла отчёта: Spiral_<имя>_<компания>_<дата>.xlsx;
            - имя респондента, компания, дата/время и версия приложения в XLSX;
            - счётчик выбранных вариантов по вопросу;
            - отображение балла и доли на итоговом экране;
            - редактирование имени и компании после прохождения без сброса ответов;
            - кнопки «Открыть файл» и «Открыть папку» после сохранения;
            - улучшения accessibility и контрастности.

            Проверка релиза: 22/22 automated tests, Open XML validation, self-contained single-file publish и smoke-test G-Spiral.exe.
          files: artifacts/publish/G-Spiral.exe
