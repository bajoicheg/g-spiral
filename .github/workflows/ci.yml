name: ci

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: g-spiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore GSpiral.sln
      - name: Test
        run: dotnet test GSpiral.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Publish portable single-file EXE
        run: dotnet publish src/GSpiral/GSpiral.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/publish/G-Spiral.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish/G-Spiral.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/publish/G-Spiral.exe

  release-v1-3-0:
    if: github.ref == 'refs/heads/feature/v1.3.0' && github.event.head_commit.message == 'release-v1.3.0'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag v1.3.0 from verified release snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.3.0 a84efd2022eb91b34cbc04014fa41aa4bfd492b1
          git push origin refs/tags/v1.3.0
      - uses: actions/download-artifact@v4
        with:
          name: G-Spiral-win-x64
          path: artifacts/publish
      - name: Create GitHub Release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          target_commitish: release/v1.3.0-source
          name: G-Spiral 1.3.0
          body: |
            G-Spiral 1.3.0 — portable Windows x64 release.

            Основные изменения:
            - одинаковые утверждения внутри этапа показываются один раз и могут начислять баллы нескольким скрытым типам;
            - баллы отображаются округлёнными, при этом внутренняя математика остаётся точной;
            - процент на результатах теперь означает выраженность относительно максимума 700 баллов для типа;
            - отдельно пояснена доля типа в сумме набранных баллов, используемая круговой диаграммой;
            - 3D pie в приложении получил отдельные боковые грани секторов вместо эффекта двух наложенных кругов;
            - при переходе между этапами список автоматически возвращается наверх;
            - добавлена многоцветная спиральная иконка EXE и окон;
            - исправлен Excel repair issue в sheetViews/frozen panes;
            - XLSX: «Таблица ответов» → «Итоги» → «Детализация ответов»;
            - «Детализация ответов» содержит иерархию Этап → Тип → Утверждение → 1/0;
            - XLSX использует native 3D pie chart и отдельные regression-тесты Open XML.

            Проверка релиза: 39/39 automated tests, Open XML validation, self-contained single-file publish и smoke-test G-Spiral.exe.
          files: artifacts/publish/G-Spiral.exe
